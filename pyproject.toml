# 告诉 pip「用什么工具来构建这个包」。hatchling 是目前最省心的构建后端
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# 工程元数据 + 运行时依赖（litellm 调模型、httpx 发 HTTP、rich 美化终端、python-dotenv 读 .env）
[project]
name = "ohopilot"
version = "0.1.0"
description = "跑在你自己的电脑上，会自己长技能的中文办公agent"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

# 可选依赖组。server 是第 15 步才用的；dev 是测试用的。装的时候写 pip install -e ".[dev]"
[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# 关键一行：oho = "ohopilot.cli:main" 读作「装完后生成一个叫 oho 的命令，它执行 ohopilot/cli.py 里的 main 函数」
[project.scripts]
oho = "ohopilot.cli:main"

# 告诉 hatchling「要打包的是 ohopilot 这个目录」，免得它自己去猜
[tool.hatch.build.targets.wheel]
packages = ["ohopilot"]